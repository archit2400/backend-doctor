name: Doctor Backend CD

on:
  workflow_run:
    workflows: ["Doctor Backend CI/CD"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |
            docker pull archit2400/doctor-backend:latest

            docker stop doctor-backend || true
            docker rm doctor-backend || true

            docker run -d \
              --name doctor-backend \
              -p 5000:5000 \
              archit2400/doctor-backend:latest